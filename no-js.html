<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript отключён</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            text-align: center;
        }
        .page {
            max-width: 520px;
            padding: 40px;
            background: rgba(255,255,255,0.08);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            backdrop-filter: blur(12px);
        }
        h1 {
            margin-bottom: 24px;
            font-size: 2rem;
        }
        p {
            margin-bottom: 32px;
            font-size: 1.05rem;
            line-height: 1.6;
            opacity: 0.9;
        }
        .refresh-button {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 999px;
            background: #ff7f00;
            color: white;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .refresh-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255,127,0,0.25);
        }
    </style>
</head>
<body>
    <div class="page">
        <h1>JavaScript отключён</h1>
        <p>Для корректной работы сайта нужен JavaScript. Пожалуйста, включите его в настройках браузера и обновите страницу.</p>
        <a class="refresh-button" href="index.html">Я включил JS, обновить страницу</a>
    </div>
</body>
</html>
